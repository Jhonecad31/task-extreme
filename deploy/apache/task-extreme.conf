<VirtualHost *:80>
    ServerName task.extremegroup.info
    Header always set X-Robots-Tag "noindex, nofollow"
    Redirect permanent / https://task.extremegroup.info/
</VirtualHost>

<VirtualHost *:443>
    ServerName task.extremegroup.info
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/task.extremegroup.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/task.extremegroup.info/privkey.pem

    Header onsuccess unset X-Robots-Tag
    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 23068672

    # Las actualizaciones SSE deben llegar al navegador de inmediato.
    SetEnvIf Request_URI "^/api/live$" no-gzip=1 no-brotli=1
    <IfModule cache_module>
        CacheDisable /
    </IfModule>

    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=75
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
