<VirtualHost *:80>
    ServerName tareas.tudominio.com
    Redirect permanent / https://tareas.tudominio.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName tareas.tudominio.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tareas.tudominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tareas.tudominio.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 23068672

    # Las actualizaciones SSE deben llegar al navegador de inmediato.
    SetEnvIf Request_URI "^/api/live$" no-gzip=1 no-brotli=1
    <IfModule cache_module>
        CacheDisable /
    </IfModule>

    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=75
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
